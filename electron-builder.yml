appId: io.darkharasho.axiom
productName: AxiOM
directories:
  output: dist_out
files:
  - dist/**
  - dist-electron/**
  - public/**
publish:
  provider: github
  owner: darkharasho
  repo: axiom
  releaseType: release
linux:
  target:
    - AppImage
  icon: build/icon.png
win:
  # Signed with Azure Artifact Signing so SmartScreen doesn't warn. Credentials come from
  # AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET (set as repo secrets in CI).
  azureSignOptions:
    publisherName: Michael Stephens
    endpoint: https://eus.codesigning.azure.net/
    codeSigningAccountName: darkharasho-signing
    certificateProfileName: public-trust
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
